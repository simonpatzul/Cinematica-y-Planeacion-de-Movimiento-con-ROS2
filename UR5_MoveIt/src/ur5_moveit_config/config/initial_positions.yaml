  # la mesa antes de la primera orden de movimiento.
  elbow_joint: 1.5708
  shoulder_lift_joint: -1.5708
  shoulder_pan_joint: 0
  wrist_1_joint: -1.5708
  wrist_2_joint: -1.5708
  wrist_3_joint: 0
